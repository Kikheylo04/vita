<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Los valores los sustituye vite-plugin-brand-html al
      compilar, leyendo src/config/brand.ts. No editar a mano: se
      perderia al siguiente build.
    -->
    <title>{{BRAND_FULL_NAME}}</title>

    <!-- SEO -->
    <meta name="description" content="{{BRAND_DESCRIPTION}}" />
    <meta name="author" content="{{BRAND_NAME}}" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="{{BRAND_DOMAIN}}" />

    <!-- Open Graph -->
    <meta property="og:type" content="restaurant" />
    <meta property="og:title" content="{{BRAND_FULL_NAME}}" />
    <meta property="og:description" content="{{BRAND_DESCRIPTION}}" />
    <meta property="og:image" content="{{BRAND_OG_IMAGE}}" />
    <meta property="og:url" content="{{BRAND_DOMAIN}}" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:site_name" content="{{BRAND_NAME}}" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{BRAND_FULL_NAME}}" />
    <meta name="twitter:description" content="{{BRAND_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{BRAND_OG_IMAGE}}" />

    <!-- Analytics -->
    {{BRAND_ANALYTICS}}

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />

    <!-- Schema.org -->
    <script type="application/ld+json">
      {{BRAND_JSON_LD}}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
